name: i18n

on:
  push:
    branches:
      - bleeding
      - tempest
  pull_request:
    paths:
      - 'doc'

jobs:
  i18n:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}/testing-base:${{ github.sha }}
      options: --volume ${{ github.workspace }}:/opt/irontec/ivozprovider
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Run internalization tests
        run: /opt/irontec/ivozprovider/library/bin/test-i18n

