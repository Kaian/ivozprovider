name: Backend

on:
  push:
    branches:
      - bleeding
      - tempest
  pull_request:
    paths:
      - '**.php'
      - 'library/**'
      - 'microservices/**'
      - 'asterisk/agi/**'
      - 'schema/**'
      - 'web/rest/**'

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    outputs:
      dockerfile-hash: ${{ steps.hash.outputs.dockerfile-hash }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Get Dockerfile hash
        id: hash
        run: echo "::set-output name=dockerfile-hash::$(sha256sum tests/backend/Dockerfile | awk '{ print $1 }')"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker buildx create --use
          docker buildx build \
            --cache-from=type=registry,ref=ghcr.io/${{ github.repository }}/testing-backend:cache \
            --cache-to=type=registry,ref=ghcr.io/${{ github.repository }}/testing-backend:cache,mode=max \
            --tag ghcr.io/${{ github.repository }}/testing-backend:${{ steps.hash.outputs.dockerfile-hash }} \
            --file tests/backend/Dockerfile \
            --push .

  composer:
    needs: [image]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}/testing-backend:${{ needs.image.outputs.dockerfile-hash }}
      options: --volume ${{ github.workspace }}:/opt/irontec/ivozprovider
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: 'library/vendor'
          key: ${{ github.repository }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ github.repository }}-composer-

      - name: Install dependencies
        run: /opt/irontec/ivozprovider/library/bin/composer-install --prefer-dist --no-progress


  static:
    needs: [composer, image]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}/testing-backend:${{ needs.image.outputs.dockerfile-hash }}
      options: --volume ${{ github.workspace }}:/opt/irontec/ivozprovider
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache/restore@v4
        with:
          path: 'library/vendor'
          key: ${{ github.repository }}-composer-${{ hashFiles('**/composer.lock') }}
          fail-on-cache-miss: true

      - run: /opt/irontec/ivozprovider/library/bin/composer-install --prefer-dist --no-progress
      - run: /opt/irontec/ivozprovider/library/bin/test-phpspec
      - run: /opt/irontec/ivozprovider/library/bin/test-psalm
      - run: /opt/irontec/ivozprovider/library/bin/test-psalm-update-baseline

  codestyle:
    needs: [composer, image]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}/testing-backend:${{ needs.image.outputs.dockerfile-hash }}
      options: --volume ${{ github.workspace }}:/opt/irontec/ivozprovider
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache/restore@v4
        with:
          path: 'library/vendor'
          key: ${{ github.repository }}-composer-${{ hashFiles('**/composer.lock') }}
          fail-on-cache-miss: true

      - run: /opt/irontec/ivozprovider/library/bin/composer-install --prefer-dist --no-progress
      - run: /opt/irontec/ivozprovider/library/bin/test-codestyle --full
      - run: /opt/irontec/ivozprovider/library/bin/test-codestyle-gherkin
